name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore Mobiphone.sln
    
    - name: Build
      run: dotnet build Mobiphone.csproj --no-restore --configuration Release
    
    - name: Test
      run: dotnet test Mobiphone.sln --no-build --configuration Release --verbosity normal
      continue-on-error: true

  create-installer:
    needs: build-and-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Setup WiX
      run: dotnet tool install --global wix --version 4.0.5
    
    - name: Restore dependencies
      run: dotnet restore Mobiphone.sln
    
    - name: Publish Application
      run: |
        dotnet publish Mobiphone.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=true `
          -o bin/Release/net8.0-windows/win-x64/publish
    
    - name: Generate WiX Components
      run: |
        $publishPath = Resolve-Path "bin\Release\net8.0-windows\win-x64\publish"
        & "Installer\Generate-Components.ps1" -PublishPath $publishPath -OutputFile "Installer\HarvestedFiles.wxs"
    
    - name: Add WiX Extension
      run: wix extension add WixToolset.Util.wixext
      continue-on-error: true
    
    - name: Build WiX Installer
      working-directory: Installer
      run: |
        wix build Package.wxs HarvestedFiles.wxs `
          -arch x64 `
          -d PublishDir=..\bin\Release\net8.0-windows\win-x64\publish `
          -out ../Mobiphone.msi
    
    - name: Get version from tag
      id: get_version
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: Mobiphone.msi
        name: Release ${{ github.ref_name }}
        body: |
          ## Mobiphone ${{ steps.get_version.outputs.VERSION }}
          
          ### Cài đặt
          1. Tải file `Mobiphone.msi`
          2. Double-click file MSI và làm theo hướng dẫn cài đặt
          3. Ứng dụng sẽ được cài đặt vào `C:\Program Files\Mobiphone\`
          4. Shortcuts sẽ được tạo trong Start Menu và Desktop
          
          ### Lưu ý quan trọng
          - **Database location**: `%LOCALAPPDATA%\Mobiphone\records.db`
          - Dữ liệu được lưu trong thư mục AppData của user (có quyền write đầy đủ)
          - MSI bao gồm đầy đủ dependencies (~60MB)
          
          ### Tính năng
          - Chuyển đổi file Excel sang SQLite database
          - Giao diện WPF thân thiện
          - Phân loại sim đặc biệt (Thần tài, Lộc phát, Tứ quý, Tam hoa kép)
          - Filter và tìm kiếm nâng cao theo nhiều tiêu chí
          - Phân trang dữ liệu
          
          ### Yêu cầu hệ thống
          - Windows 10/11 (64-bit)
          - .NET 8.0 Runtime (đã được bundle sẵn trong installer)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload MSI as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mobiphone-${{ steps.get_version.outputs.VERSION }}-installer
        path: Mobiphone.msi
