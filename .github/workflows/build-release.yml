name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:

  create-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Setup WiX
      run: dotnet tool install --global wix --version 4.0.5
    
    - name: Restore dependencies
      run: dotnet restore Mobiphone.sln
    
    - name: Publish Application
      run: |
        dotnet publish Mobiphone.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=true `
          -o bin/Release/net8.0-windows/win-x64/publish
    
    - name: Generate WiX Components
      run: |
        $publishPath = Resolve-Path "bin\Release\net8.0-windows\win-x64\publish"
        & "Installer\Generate-Components.ps1" -PublishPath $publishPath -OutputFile "Installer\HarvestedFiles.wxs"
    
    - name: Add WiX Extension
      run: wix extension add WixToolset.Util.wixext
      continue-on-error: true
    
    - name: Build WiX Installer
      working-directory: Installer
      run: |
        wix build Package.wxs HarvestedFiles.wxs `
          -arch x64 `
          -d PublishDir=..\bin\Release\net8.0-windows\win-x64\publish `
          -out "../SC Hoang Quoc.msi"
    
    - name: Get version from tag
      id: get_version
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: SC Hoang Quoc.msi
        name: Release ${{ github.ref_name }}
        body: |
          ## SC Hoang Quoc ${{ steps.get_version.outputs.VERSION }}
          
          ### Cài đặt
          1. Tải file `SC Hoang Quoc.msi`
          2. Double-click file MSI và làm theo hướng dẫn cài đặt
          3. Ứng dụng sẽ được cài đặt vào `C:\Program Files\SC Hoang Quoc\`
          4. Shortcuts sẽ được tạo trong Start Menu và Desktop
          
          ### Lưu ý quan trọng
          - **Database location**: `%LOCALAPPDATA%\SC Hoang Quoc\records.db`
          - Dữ liệu được lưu trong thư mục AppData của user (có quyền write đầy đủ)
          - MSI bao gồm đầy đủ dependencies (~60MB)

        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload MSI as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SC Hoang Quoc-${{ steps.get_version.outputs.VERSION }}-installer
        path: SC Hoang Quoc.msi
