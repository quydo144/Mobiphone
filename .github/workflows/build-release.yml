name: Build and Release

on:
  push:
    branches:
      - Release

permissions:
  contents: write

jobs:
  create-installer:
    runs-on: windows-latest

    steps:

      # ========================================
      # Checkout source
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================
      # Get next version
      # ========================================
      - name: Get next version
        id: version
        shell: pwsh
        run: |
          # Get latest semantic version tag
          $latestTag = git tag --list "v*" --sort=-version:refname | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($latestTag)) {
              # No tag exists yet
              $newVersion = "1.0.0"
          }
          else {
              Write-Host "Latest tag: $latestTag"

              $version = $latestTag -replace '^v', ''
              $parts = $version.Split('.')

              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]

              # Increase patch version
              $patch++

              $newVersion = "$major.$minor.$patch"
          }

          $newTag = "v$newVersion"

          Write-Host "========================================"
          Write-Host "Latest tag : $latestTag"
          Write-Host "New version: $newVersion"
          Write-Host "New tag    : $newTag"
          Write-Host "========================================"

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          echo "TAG=$newTag" >> $env:GITHUB_OUTPUT

      # ========================================
      # Setup .NET
      # ========================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ========================================
      # Setup WiX
      # ========================================
      - name: Setup WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5

      # ========================================
      # Restore dependencies
      # ========================================
      - name: Restore dependencies
        run: dotnet restore Mobiphone.sln

      # ========================================
      # Publish Application
      # ========================================
      - name: Publish Application
        run: |
          dotnet publish Mobiphone.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -o bin/Release/net8.0-windows/win-x64/publish

      # ========================================
      # Generate WiX Components
      # ========================================
      - name: Generate WiX Components
        shell: pwsh
        run: |
          $publishPath = Resolve-Path "bin\Release\net8.0-windows\win-x64\publish"

          & "Installer\Generate-Components.ps1" `
            -PublishPath $publishPath `
            -OutputFile "Installer\HarvestedFiles.wxs"

      # ========================================
      # Add WiX Extension
      # ========================================
      - name: Add WiX Extension
        shell: pwsh
        run: |
          wix extension add WixToolset.Util.wixext

      # ========================================
      # Build MSI
      # ========================================
      - name: Build WiX Installer
        working-directory: Installer
        shell: pwsh
        run: |
          wix build Package.wxs HarvestedFiles.wxs `
            -arch x64 `
            -d PublishDir=..\bin\Release\net8.0-windows\win-x64\publish `
            -out "../SC Hoang Quoc.msi"

      # ========================================
      # Verify MSI
      # ========================================
      - name: Verify MSI
        shell: pwsh
        run: |
          $msiPath = "SC Hoang Quoc.msi"

          if (!(Test-Path $msiPath)) {
              Write-Error "MSI file was not created."
              exit 1
          }

          $file = Get-Item $msiPath

          Write-Host "========================================"
          Write-Host "MSI created successfully"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"
          Write-Host "========================================"

      # ========================================
      # Create Git tag
      # ========================================
      - name: Create Git tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $tag = "${{ steps.version.outputs.TAG }}"

          Write-Host "Creating tag: $tag"

          git tag $tag
          git push origin $tag

      # ========================================
      # Create GitHub Release
      # ========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}

          body: |
            ## SC Hoang Quoc ${{ steps.version.outputs.VERSION }}

            ### Cài đặt

            1. Tải file `SC Hoang Quoc.msi`
            2. Double-click file MSI và làm theo hướng dẫn cài đặt
            3. Ứng dụng sẽ được cài đặt vào:
               `C:\Program Files\SC Hoang Quoc\`
            4. Shortcuts sẽ được tạo trong Start Menu và Desktop

            ### Lưu ý quan trọng

            - **Database location**: `%LOCALAPPDATA%\SC Hoang Quoc\records.db`
            - Dữ liệu được lưu trong thư mục AppData của user
            - MSI bao gồm đầy đủ dependencies

            ### Version

            `${{ steps.version.outputs.VERSION }}`

          files: |
            SC Hoang Quoc.msi

          draft: false
          prerelease: false

      # ========================================
      # Upload MSI as GitHub Actions Artifact
      # ========================================
      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC Hoang Quoc-${{ steps.version.outputs.VERSION }}-installer
          path: SC Hoang Quoc.msi